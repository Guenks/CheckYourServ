name: push_pull

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src/
      - run: npm run build
      # - run: npm test   # uncomment when tests availables

  backend:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: backend
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
            cache: pip
        - run: pip install -r requirements.txt ruff mypy
        - run: ruff check .
        - run: ruff format --check .
        - run: mypy .
        # - run: pip install pytest httpx && pytest   # uncomment when tests availables

  spelling:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
        - run: npx cspell --no-progress "**/*.{js,vue,py,md,json}"
