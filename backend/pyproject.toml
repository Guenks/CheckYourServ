[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # imports sort
    "UP",       # modern Python syntax
    "B",        # bugbear
    "N",        # namming convention
    "RUF",      # Ruff rules
    "Q",        # check quote
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = [
    "^\\.venv/",
    "^venv/",
    "^build/",
    "^dist/",
    "/node_modules/",
]